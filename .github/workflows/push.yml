name: Build docker image and push to GitHub Packages

on:
  push:
    branches:
      - "develop"
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ktra
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "`db-redis` build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/ktra.Dockerfile
          tags: ${{ env.IMAGE_NAME }}:db-redis-${{ env.TAG }}
          no-cache: true
          build-args: |
            DB=db-redis
          push: true

      - name: "`db-mongo` build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/ktra.Dockerfile
          tags: ${{ env.IMAGE_NAME }}:db-mongo-${{ env.TAG }}
          no-cache: true
          build-args: |
            DB=db-mongo
          push: true

      - name: "`db-sled` build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/ktra.Dockerfile
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          push: true

      - name: "`db-redis + openid` build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/ktra_openid.Dockerfile
          tags: ${{ env.IMAGE_NAME }}:db-redis-openid-${{ env.TAG }}
          no-cache: true
          build-args: |
            DB=db-redis
          push: true

      - name: "`db-mongo + openid` build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/ktra_openid.Dockerfile
          tags: ${{ env.IMAGE_NAME }}:db-mongo-openid-${{ env.TAG }}
          no-cache: true
          build-args: |
            DB=db-mongo
          push: true

      - name: "`db-sled + openid` build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/ktra_openid.Dockerfile
          tags: ${{ env.IMAGE_NAME }}:openid-${{ env.TAG }}
          push: true
